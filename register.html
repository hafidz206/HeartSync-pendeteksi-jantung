<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HeartSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <!-- Global SVG Definitions -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="logo" viewBox="0 0 120 100">
                <path d="M60 94 8 40C-2 24 8 6 26 6c14 0 24 8 34 22L60 94Z" fill="#E04545" />
                <path d="M60 28C70 12 90 4 104 14c14 12 12 30 0 44L60 94Z" fill="#1E8FCB" />
                <line x1="44" y1="4" x2="44" y2="8" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <line x1="38" y1="7" x2="41" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <line x1="50" y1="7" x2="47" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <path d="M22 54h18l8-24 12 40 10-34 8 18h42" fill="none" stroke="#fff" stroke-width="9"
                    stroke-linejoin="round" stroke-linecap="round" />
                <path d="M22 54h18l8-24 12 40 10-34 8 18h42" fill="none" stroke="#1177B8" stroke-width="5"
                    stroke-linejoin="round" stroke-linecap="round" />
                <path d="M102 54l6-4M102 54l6 4" fill="none" stroke="#1177B8" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round" />
                <line x1="97" y1="47" x2="110" y2="47" stroke="#1E8FCB" stroke-width="2" stroke-linecap="round" />
                <line x1="97" y1="61" x2="110" y2="61" stroke="#1E8FCB" stroke-width="2" stroke-linecap="round" />
                <path d="M44 14v14M37 21h14" stroke="#fff" stroke-width="5" stroke-linecap="round" />
            </symbol>
            <symbol id="heart3d" viewBox="0 0 100 90">
                <defs>
                    <radialGradient id="hg" cx="35%" cy="30%" r="80%">
                        <stop offset="0" stop-color="#FF6B6B" />
                        <stop offset=".6" stop-color="#E5232B" />
                        <stop offset="1" stop-color="#B3121A" />
                    </radialGradient>
                </defs>
                <path
                    d="M50 86C20 62 3 46 3 27 3 13 14 4 27 4c10 0 18 5 23 13C55 9 63 4 73 4c13 0 24 9 24 23 0 19-17 35-47 59Z"
                    fill="url(#hg)" />
                <path d="M20 46h16l7-18 11 32 9-25 6 11h14" fill="none" stroke="#fff" stroke-width="6"
                    stroke-linecap="round" stroke-linejoin="round" opacity=".92" />
            </symbol>
            <symbol id="g" viewBox="0 0 48 48">
                <path fill="#EA4335"
                    d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z" />
                <path fill="#FBBC05"
                    d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z" />
                <path fill="#34A853"
                    d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z" />
            </symbol>
        </defs>
    </svg>

    <!-- 3D Heart Floating Elements (Matching Reference Design) -->
    <div class="auth-deco top-right">
        <svg viewBox="0 0 100 90">
            <use href="#heart3d" />
        </svg>
    </div>
    <div class="auth-deco bottom-left">
        <svg viewBox="0 0 100 90">
            <use href="#heart3d" />
        </svg>
    </div>

    <!-- Register Card -->
    <main class="auth-card register-card" role="main">
        <header class="auth-header">
            <a href="landing.html" class="auth-logo" title="Kembali ke Beranda" style="text-decoration:none">
                <svg viewBox="0 0 120 100" aria-label="HeartSync Logo">
                    <use href="#logo" />
                </svg>
                <span>HeartSync</span>
            </a>
            <h1 class="auth-title">Buat akun sekarang!</h1>
            <p class="auth-sub">Silahkan buat akun anda untuk melanjutkan</p>
        </header>

        <form id="registerForm">
            <div class="form-group">
                <label for="r-nama">Nama</label>
                <input type="text" id="r-nama" class="form-control" placeholder="Masukkan nama anda..."
                    autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="r-email">Email</label>
                <input type="email" id="r-email" class="form-control" placeholder="Masukkan email anda..."
                    autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="r-pass">Kata sandi</label>
                <input type="password" id="r-pass" class="form-control" placeholder="Masukkan kata sandi anda..."
                    autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="r-pass2">Konfirmasi Password</label>
                <input type="password" id="r-pass2" class="form-control" placeholder="Masukkan kata sandi anda..."
                    autocomplete="new-password" required>
            </div>

            <div class="auth-error" id="registerError" role="alert"></div>

            <button type="submit" class="btn-auth">Buat</button>

            <div class="auth-divider">Atau</div>

            <div class="google-wrapper">
                <button type="button" class="btn-google">
                    <svg viewBox="0 0 48 48">
                        <use href="#g" />
                    </svg>
                    <span>Login with <b>Google</b></span>
                </button>
            </div>

            <p class="auth-switch" style="margin-top:14px">Sudah punya akun? <a href="login.html">Masuk</a></p>

            <a href="landing.html" class="auth-back-link">&larr; Kembali ke Halaman Utama</a>
        </form>
    </main>

    <script src="js/global.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
