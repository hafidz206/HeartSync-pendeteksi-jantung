<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/quiz.css">

<body class="quiz-page">

                <line x1="38" y1="7" x2="41" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <line x1="50" y1="7" x2="47" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <path d="M22 54h18l8-24 12 40 10-34 8 18h42" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />

        </defs>

    <!-- Top Header: Logo + Progress Bars -->
    <header class="quiz-top" role="banner">
        <a href="landing.html" class="brand-logo" title="Kembali ke Selamat Datang">
            <svg viewBox="0 0 120 100" aria-label="HeartSync Logo">
                <use href="#logo" />
            </svg>
            <span class="brand-text">HeartSync</span>
        </a>
        <div class="quiz-bars" id="bars" role="progressbar" aria-label="Progres pengisian kuesioner"></div>
    </header>

    <!-- Question Title & Hint -->
    <h1 class="quiz-title" id="qtitle">Pertanyaan</h1>
    <p class="quiz-hint">Jawaban anda akan membantu kami untuk sesuai dengan kebutuhan anda</p>

    <!-- Quiz Card: Options + Navigation Button -->
    <main class="quiz-card" role="main">
        <div class="quiz-opts" id="opts"></div>
        <button class="btn-next" id="next" type="button">Berikutnya</button>
    </main>

    <!-- Back Navigation -->
    <button class="btn-back-quiz" id="back" type="button">← Soal Sebelumnya</button>

    <script src="../js/global.js"></script>
    <script src="../js/quiz.js"></script>

</html>
