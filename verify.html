<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Akun - HeartSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .dev-code-box {
            background: #FFF5F6;
            border: 2px dashed #E04545;
            border-radius: 12px;
            padding: 12px 18px;
            margin: 14px 0;
            text-align: center;
            font-size: 13px;
            color: #374151;
        }
        .dev-code-box strong {
            font-size: 22px;
            color: var(--primary-red);
            letter-spacing: 6px;
            display: block;
            margin-top: 4px;
        }
        .dev-code-label {
            font-size: 11px;
            color: #9CA3AF;
            margin-top: 4px;
        }
        .btn-autofill {
            font-size: 12px;
            background: none;
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            border-radius: 999px;
            padding: 4px 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .btn-autofill:hover {
            background: var(--primary-red);
            color: #fff;
        }
    </style>
</head>
<body class="auth-page">

    <!-- Global SVG Definitions -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="logo" viewBox="0 0 120 100">
                <path d="M60 94 8 40C-2 24 8 6 26 6c14 0 24 8 34 22L60 94Z" fill="#E04545" />
                <path d="M60 28C70 12 90 4 104 14c14 12 12 30 0 44L60 94Z" fill="#1E8FCB" />
                <line x1="44" y1="4" x2="44" y2="8" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <line x1="38" y1="7" x2="41" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <line x1="50" y1="7" x2="47" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <path d="M22 54h18l8-24 12 40 10-34 8 18h42" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />
                <path d="M22 54h18l8-24 12 40 10-34 8 18h42" fill="none" stroke="#1177B8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
                <path d="M102 54l6-4M102 54l6 4" fill="none" stroke="#1177B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                <line x1="97" y1="47" x2="110" y2="47" stroke="#1E8FCB" stroke-width="2" stroke-linecap="round" />
                <line x1="97" y1="61" x2="110" y2="61" stroke="#1E8FCB" stroke-width="2" stroke-linecap="round" />
                <path d="M44 14v14M37 21h14" stroke="#fff" stroke-width="5" stroke-linecap="round" />
            </symbol>
            <symbol id="heart3d" viewBox="0 0 100 90">
                <defs>
                    <radialGradient id="hg" cx="35%" cy="30%" r="80%">
                        <stop offset="0" stop-color="#FF6B6B" />
                        <stop offset=".6" stop-color="#E5232B" />
                        <stop offset="1" stop-color="#B3121A" />
                    </radialGradient>
                </defs>
                <path d="M50 86C20 62 3 46 3 27 3 13 14 4 27 4c10 0 18 5 23 13C55 9 63 4 73 4c13 0 24 9 24 23 0 19-17 35-47 59Z" fill="url(#hg)" />
                <path d="M20 46h16l7-18 11 32 9-25 6 11h14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".92" />
            </symbol>
        </defs>
    </svg>

    <!-- 3D Heart Floating Elements -->
    <div class="auth-deco top-right">
        <svg viewBox="0 0 100 90"><use href="#heart3d" /></svg>
    </div>
    <div class="auth-deco bottom-left">
        <svg viewBox="0 0 100 90"><use href="#heart3d" /></svg>
    </div>

    <!-- Verification Card -->
    <main class="auth-card verify-card" role="main">
        <header class="auth-header">
            <a href="welcome.html" class="auth-logo" title="Kembali ke Beranda" style="text-decoration:none">
                <svg viewBox="0 0 120 100" aria-label="HeartSync Logo"><use href="#logo" /></svg>
                <span>HeartSync</span>
            </a>
            <h1 class="auth-title">Kode Verifikasi</h1>
            <p class="auth-sub" style="color:var(--text-secondary)">
                Kami telah membuat kode 5-digit untuk akun<br>
                <b id="vemail" style="color:var(--primary-red);font-weight:600">-</b>
            </p>
        </header>

        <div class="verify-box">
            <!-- Dev helper: tampilkan kode dari server -->
            <div class="dev-code-box" id="devCodeBox" style="display:none">
                🔑 Kode Verifikasi Anda:
                <strong id="devCode">-</strong>
                <span class="dev-code-label">Karena Laragon tidak kirim email, kode ditampilkan di sini</span>
                <br>
                <button class="btn-autofill" id="autofillBtn" type="button">✓ Isi Otomatis</button>
            </div>

            <h4 class="verify-input-label">Masukkan 5 Digit Kode</h4>
            <div class="codes-grid">
                <input maxlength="1" inputmode="numeric" aria-label="Digit 1" autofocus>
                <input maxlength="1" inputmode="numeric" aria-label="Digit 2">
                <input maxlength="1" inputmode="numeric" aria-label="Digit 3">
                <input maxlength="1" inputmode="numeric" aria-label="Digit 4">
                <input maxlength="1" inputmode="numeric" aria-label="Digit 5">
            </div>

            <button type="button" class="btn-auth" id="vbtn">Verifikasi Akun</button>

            <div class="resend-row">
                Tidak menerima kode? <a id="resend" href="#">Kirim ulang</a>
            </div>

            <a href="login.html" class="auth-back-link">&larr; Kembali ke Halaman Login</a>
        </div>
    </main>

    <script src="js/global.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Ambil dan tampilkan kode verifikasi dari server (hanya mode development Laragon)
        document.addEventListener('DOMContentLoaded', async () => {
            const email = storage.get('heartsync_pending_email');
            if (!email) return;

            try {
                const res = await fetch('api/get_code.php?email=' + encodeURIComponent(email));
                const data = await res.json();
                if (data.success && data.code) {
                    const box = document.getElementById('devCodeBox');
                    const codeEl = document.getElementById('devCode');
                    const autofill = document.getElementById('autofillBtn');
                    if (box && codeEl) {
                        codeEl.textContent = data.code;
                        box.style.display = 'block';
                    }
                    if (autofill) {
                        autofill.addEventListener('click', () => {
                            const inputs = document.querySelectorAll('.codes-grid input');
                            const digits = String(data.code).split('');
                            inputs.forEach((inp, i) => {
                                inp.value = digits[i] || '';
                            });
                        });
                    }
                }
            } catch (e) {
                // Gagal ambil kode - tidak masalah, tetap bisa input manual
            }
        });
    </script>
</body>
</html>
