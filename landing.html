<!DOCTYPE html>
<html lang="id">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang - HeartSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="css/welcome.css">

<body class="welcome-page">

                <line x1="38" y1="7" x2="41" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <line x1="50" y1="7" x2="47" y2="10" stroke="#E04545" stroke-width="2.5" stroke-linecap="round" />
                <path d="M22 54h18l8-24 12 40 10-34 8 18h42" fill="none" stroke="#fff" stroke-width="9"

            </symbol>
        </defs>
    </svg>

    <main class="welcome-container" role="main">
        <!-- Logo HeartSync -->
        <a href="welcome.html" class="welcome-logo" title="Kembali ke Beranda">
            <svg viewBox="0 0 120 100" aria-label="HeartSync Logo">
                <use href="#logo" />
            </svg>
            <span>HeartSync</span>
        </a>

        <!-- Main Title -->
        <h1 class="welcome-title">SELAMAT DATANG</h1>

        <!-- Tagline -->
        <h2 class="welcome-tagline">Yuk, Kenali kesehatan jantungmu!</h2>

        <!-- Description -->
        <p class="welcome-desc">
            Lengkapi data dirimu terlebih dahulu agar kami dapat membantu mengenali kondisi kesehatanmu dan memberikan rekomendasi aktivitas yang sesuai dengan kebutuhanmu.
        </p>

        <!-- CTA Pill Button: Lengkapi Data Diri (Quiz) -->
        <a href="quiz.html" class="btn-welcome-cta">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <span>Lengkapi data diri</span>
            <span>&rarr;</span>
        </a>

        <p style="margin-top:22px;font-size:13.5px;color:#6B7280">
            Sudah pernah mengisi kuesioner? <a href="dashboard.html"
                style="color:var(--primary-red);font-weight:600;text-decoration:none">Langsung ke Dashboard</a>

    <script src="js/global.js"></script>
